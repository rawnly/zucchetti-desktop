[tools]
node = "26.13.0"

[tasks.dev]
description = "alchemy dev"
run = "npm run dev"

[tasks.typecheck]
description = "tsc --noEmit"
run = "npm run typecheck"

[tasks.test]
description = "Unit tests of src/"
depends = [":typecheck"]
run = "npm test"

[tasks.deploy]
description = "alchemy deploy (stack: R2 + Worker + cron)"
run = "npm run deploy"
